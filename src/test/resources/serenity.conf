serenity {
  project.name = "La Botica del Alquimista - Pruebas Front-End"
  test.root = "features"
  requirements.dir = "src/test/resources/features"
  take.screenshots = FOR_FAILURES      # FOR_EACH_ACTION solo para depurar: vuelve lenta la suite
  report.encoding = UTF8
}

screenplay.pronouns = "él,ella,ellos,ellas,su,sus"

webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 5000
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1920,1080", "--no-sandbox", "--disable-dev-shm-usage", "--remote-allow-origins=*"]
    }
  }
}

environments {
  default { webdriver.base.url = "https://boticaalquimista.onrender.com" }
  local   { webdriver.base.url = "http://localhost:8080" }
}
